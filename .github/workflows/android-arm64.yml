name: Android arm64 Build

# 独立的 arm64-v8a 单 ABI 编译流水线: 不写 Release、不发 Telegram、不上蓝奏,
# 也不 workflow_call 其他流水线 (旧 test/release/ios/_desktop/_publish 均已禁用为 .yml.bak,
# 本文件必须自包含)。
on:
  push:
    branches:
      - '**'
    # 文档/资源类变更不触发构建
    paths-ignore:
      - '**.md'
      - '**/assets/**'
      - '**/ISSUE_TEMPLATE/**'
      - '**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**/assets/**'
      - '**/ISSUE_TEMPLATE/**'
      - '**/modules/web/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 只读产物, 不写 Release/tag
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      product: app
      GRADLE_ARGS: --build-cache --parallel --daemon --warning-mode all
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Gradle build-cache 共享
        # 按 commit 存条目、前缀回退到分支最近条目: 跨 commit 复用热缓存, 同时避免
        # 单一 (OS, 分支) 条目被多提交长期读写、弱输入声明任务命中陈旧条目
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-buildcache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-buildcache-${{ runner.os }}-

      - name: 清除 :ui 陈旧生成物/增量状态
        # 缓存回退可能带入上个 commit 的 ui/build (旧 compose 资源生成物 + 旧 Kotlin
        # 增量编译状态), 导致 :ui:compileAndroidMain 看不见本 run 新生成的 Res 属性。
        # 仅删生成物与增量状态, 其余中间产物保留。
        run: rm -rf ui/build/generated/compose ui/build/kotlin

      - name: Release Apk Sign
        # 沿用仓库内公开的测试签名密钥 (与 test.yml.bak 同一做法): 密钥提交在仓库里且口令
        # 明文硬编码, 任何人 clone 即可签出「看起来官方」的包。仅用于 CI 测试包,
        # 不得与正式签名 (RELEASE_KEY_STORE secret) 混用。
        run: |
          echo "给apk增加签名"
          cp $GITHUB_WORKSPACE/.github/workflows/legado.jks $GITHUB_WORKSPACE/app/legado.jks
          sed '$a\RELEASE_STORE_FILE=./legado.jks'          $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_KEY_ALIAS=legado'                 $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_STORE_PASSWORD=gedoor_legado'     $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_KEY_PASSWORD=gedoor_legado'       $GITHUB_WORKSPACE/gradle.properties -i

      - name: Build Release (arm64-v8a)
        run: |
          VERSION=$(date -d "8 hour" -u +3.%y.%m%d%H%M)
          echo "开始${{ env.product }} arm64-v8a 构建, 版本 $VERSION"
          chmod +x gradlew
          ./gradlew assemble${{ env.product }}release -PappVersion=$VERSION -Parm64Only=true $GRADLE_ARGS
          echo "收集APK"
          mkdir -p apk/
          # 只收 appRelease 变体目录: baselineprofile 插件还会为 appNonMinifiedRelease /
          # appBenchmarkRelease 注册 copy 任务, 宽 find 会把它们扫进来导致下方 count 误判
          find app/build/outputs/renamed-apks/appRelease -name "*.apk" -exec mv {} apk/ \;

      - name: Dump generated compose resources (diagnostic)
        # 诊断用: 打印 compose 资源生成产物与新文案落点, 编译失败时也执行,
        # 用于核对 Res 字符串属性是否真正生成 (不参与构建判定, 恒 exit 0)
        if: always()
        run: |
          K=ui/build/generated/compose/resourceGenerator/kotlin
          echo "=== generated .kt under kotlin/ ==="
          find $K -name '*.kt' 2>/dev/null | sort | sed 's|^|KT |'
          echo "=== font_scan_empty context in .kt ==="
          grep -rn -B2 -A4 "font_scan_empty" $K --include='*.kt' 2>/dev/null | sed 's|^|CH |' | head -40
          echo "=== Res.kt nested objects ==="
          find $K -name 'Res.kt' -exec sed -n '1,40p' {} \; 2>/dev/null | sed 's|^|RES |'
          echo "=== other_folder chunk location (control) ==="
          grep -rln "other_folder" $K --include='*.kt' 2>/dev/null | sed 's|^|CTRL |'
          echo "=== source xml occurrences ==="
          grep -rn "font_scan_empty" ui/src/commonMain/composeResources/ 2>/dev/null | sed 's|^|SRC |'
          true

      - name: Verify single arm64 APK
        # 恰好 1 个产物: arm64Only 未生效会出 3 个 (arm64 + armv7 + universal), 当场拦住
        run: |
          count=$(find apk/ -name "*.apk" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 APK (arm64-v8a only), got $count - arm64Only filter not applied?"
            find apk/ -name "*.apk" -ls
            exit 1
          fi
          ls -lh apk/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: legadopro
          path: apk/*.apk
          if-no-files-found: error
